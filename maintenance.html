<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{{SCHOOL_NAME}} - Under Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 20% 20%, #1d1d38 0%, #0d0d1a 55%, #080812 100%);
            color: #e6e6f0;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        .logo-area { margin-bottom: 18px; }
        #login-logo {
            width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 20px;
            background: #1a1a2e; color: var(--accent, #f59e0b);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 800; letter-spacing: 1px;
            box-shadow: 0 0 0 1px rgba(245,158,11,.35), 0 12px 40px rgba(0,0,0,.45);
        }
        #login-logo[style*="background-image"] {
            background-color: transparent !important;
            text-indent: -9999px;
            overflow: hidden;
        }
        .school-name { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: .3px; }

        /* ---- Animated "crew at work" scene ---- */
        .scene { position: relative; width: 220px; height: 170px; margin: 8px auto 4px; }
        .pulse-ring {
            position: absolute; left: 50%; top: 66px;
            width: 190px; height: 190px; margin-left: -95px; margin-top: -95px;
            border: 2px solid rgba(245,158,11,.25); border-radius: 50%;
            animation: pulse 2.6s ease-out infinite;
        }
        .pulse-ring.r2 { animation-delay: 1.3s; border-color: rgba(245,158,11,.16); }
        /* --- Interlocked gears -------------------------------------------------
           Two real meshed gears. For gears that actually turn against each other:
             * both turn in OPPOSITE directions (external mesh),
             * angular speeds are inversely proportional to tooth counts,
             * the pitch circles are exactly TANGENT so the teeth engage.
           Big gear: 12 teeth. Small gear: 8 teeth  ->  small must turn 12/8 = 1.5x
           faster than the big one, in the opposite direction.
           Pitch radius = (teeth * module) / 2; module = 7px here, so
             big  r = 12*7/2 = 42px  (outer 52px with the tooth tips)
             small r =  8*7/2 = 28px  (outer 38px)
           Centre distance for a correct mesh = 42 + 28 = 70px.
        ---------------------------------------------------------------------- */
        .gearbox { position: absolute; inset: 0; }
        .gear {
            position: absolute; border-radius: 50%;
            /* machined body: dark metal disc, lit from the top-left */
            background:
                radial-gradient(circle at 38% 32%, #4b4b66 0%, #34344c 42%, #23233a 78%, #1b1b2e 100%);
            box-shadow:
                0 10px 22px rgba(0,0,0,.6),
                0 2px 6px rgba(0,0,0,.5),
                inset 0 0 0 1px rgba(245,158,11,.25);
        }
        /* teeth: a repeating conic gradient masked to the OUTER RIM, so the
           silhouette shows real gear teeth. The mask is generous (from 62% of
           the radius outward) - too narrow a band and the teeth vanish.
           --tp = tooth pitch (360/teeth), --tw = tooth width. Teeth are drawn
           ~30% of pitch wide, matching real gears, and the small gear's pitch
           is different so the two rims actually interlock. */
        .gear::before {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: repeating-conic-gradient(from 0deg,
                var(--tooth) 0deg var(--tw), transparent var(--tw) var(--tp));
            /* closest-side matters: a plain `circle` mask is sized to the
               farthest CORNER, so the percentages would land outside the gear
               and the teeth would vanish. */
            -webkit-mask: radial-gradient(circle closest-side, transparent 0 var(--rim-in), #000 calc(var(--rim-in) + 2%) 100%);
            mask: radial-gradient(circle closest-side, transparent 0 var(--rim-in), #000 calc(var(--rim-in) + 2%) 100%);
            filter: drop-shadow(0 1px 1px rgba(0,0,0,.6));
        }
        /* hub + bolt circle: reads as the axle and gives the gear scale */
        .gear::after {
            content: ""; position: absolute; left: 50%; top: 50%;
            width: 30%; height: 30%; margin-left: -15%; margin-top: -15%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 40% 34%, #52526e, #26263d 72%);
            box-shadow:
                inset 0 0 0 2px rgba(245,158,11,.55),
                inset 0 2px 5px rgba(255,255,255,.07),
                0 2px 5px rgba(0,0,0,.6);
        }
        /* 12 teeth -> one revolution in 6s */
        .gear.big {
            width: 104px; height: 104px;
            --tooth: #f59e0b; --tw: 17deg; --tp: 30deg; --rim-in: 72%;
            left: 6px; top: 30px;
            animation: spin 6s linear infinite;
        }
        /* 8 teeth, 1.5x faster, opposite direction: 6s / (8/12) = 4s.
           Big centre = (58, 82). Pitch radius = teeth*module/2 (module 7px):
           big 42px, small 28px -> tangent centre distance 70px, so the small
           gear centre sits at (128, 82). */
        .gear.small {
            width: 76px; height: 76px;
            --tooth: #fbbf24; --tw: 24deg; --tp: 45deg; --rim-in: 72%;
            left: 90px; top: 44px;
            animation: spin 4s linear infinite reverse;
        }
        /* mesh contact shadow so the teeth look engaged, not overlapping */
        .mesh-point {
            position: absolute; left: 88px; top: 74px; width: 20px; height: 16px;
            margin: -8px 0 0 -10px; border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0,0,0,.32), transparent 72%);
            pointer-events: none;
        }
        /* specular sweep that stays still while the metal turns underneath */
        .gear-gloss {
            position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
            background:
                linear-gradient(150deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,.26) 100%),
                radial-gradient(circle at 26% 22%, rgba(255,255,255,.10), transparent 46%);
        }
        .gear-gloss.big { left: 6px; top: 30px; width: 104px; height: 104px; }
        .gear-gloss.small { left: 90px; top: 44px; width: 76px; height: 76px; }
        /* oil sheen pooling in the lower-right of each gear */
        .gear-oil {
            position: absolute; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle at 62% 68%, rgba(245,158,11,.13), transparent 58%);
        }
        .gear-oil.big { left: 6px; top: 30px; width: 104px; height: 104px; }
        .gear-oil.small { left: 90px; top: 44px; width: 76px; height: 76px; }
        .wrench {
            position: absolute; right: 4px; top: -6px;
            font-size: 34px; line-height: 1;
            transform-origin: 50% 80%;
            animation: swing 1.6s ease-in-out infinite;
            filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
            opacity: .95;
        }
        .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; opacity: 0; animation: sparkle 3.2s ease-in-out infinite; }
        .spark.s1 { left: 6px; top: 0; animation-delay: 0s; }
        .spark.s2 { right: 0; top: 18px; animation-delay: .8s; width: 6px; height: 6px; }
        .spark.s3 { left: 40px; bottom: 0; animation-delay: 1.6s; width: 7px; height: 7px; }
        .spark.s4 { right: 34px; bottom: 2px; animation-delay: 2.4s; width: 5px; height: 5px; }

        .heading { font-size: 30px; font-weight: 800; color: #fff; margin: 6px 0 10px; }
        .heading span { color: var(--accent, #f59e0b); }
        .message { font-size: 15px; line-height: 1.65; color: #b8b8cf; max-width: 520px; margin: 0 auto 18px; }
        .bar-wrap { width: min(360px, 82vw); margin: 0 auto; }
        .bar { height: 10px; background: #1d1d36; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
        .bar-fill {
            height: 100%; width: 46%;
            background: repeating-linear-gradient(45deg, #f59e0b 0 12px, #d98a06 12px 24px);
            border-radius: 999px;
            animation: slide 1.1s linear infinite, drift 3s ease-in-out infinite;
        }
        .bar-label { margin-top: 10px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #8b8ba6; animation: blink 1.6s ease-in-out infinite; }

        .admin-link { margin-top: 26px; font-size: 12px; color: #7d7d9a; }
        .admin-link a { color: var(--accent, #f59e0b); cursor: pointer; text-decoration: none; font-weight: 600; }

        #admin-form { display: none; margin: 20px auto 0; max-width: 300px; text-align: left; }
        #admin-form .field { margin-bottom: 12px; }
        #admin-form label { display: block; font-size: 12px; color: #a0a0bd; margin-bottom: 5px; font-weight: 600; }
        #admin-form input {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b2b48;
            background: #14142b; color: #fff; font-size: 14px; outline: none;
        }
        #admin-form input:focus { border-color: var(--accent, #f59e0b); }
        #admin-form button {
            width: 100%; margin-top: 4px; padding: 11px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #f59e0b, #e08e00); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        #admin-form button:disabled { opacity: .6; cursor: wait; }
        #mt-err { font-size: 12px; color: #ff6b6b; margin-top: 10px; min-height: 16px; text-align: center; }

        footer { margin-top: 34px; font-size: 11px; color: #565674; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes swing { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(20deg); } }
        @keyframes pulse { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }
        @keyframes sparkle { 0%,100% { transform: translateY(0) scale(1); opacity: 0; } 50% { transform: translateY(-16px) scale(1.5); opacity: .9; } }
        @keyframes slide { to { background-position: 24px 0; } }
        @keyframes drift { 0%,100% { width: 46%; } 50% { width: 70%; } }
        @keyframes blink { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
        @media (max-width: 480px) {
            .heading { font-size: 24px; }
            .scene { transform: scale(.85); }
        }
    </style>
    {{LOGO_CSS}}
</head>
<body>
    <div class="logo-area">
        <div id="login-logo">{{INITIALS}}</div>
        <div class="school-name">{{SCHOOL_NAME}}</div>
    </div>

    <div class="scene">
        <div class="pulse-ring"></div>
        <div class="pulse-ring r2"></div>
        <div class="gearbox">
            <div class="gear big"></div>
            <div class="gear small"></div>
            <div class="mesh-point"></div>
            <div class="gear-oil big"></div>
            <div class="gear-oil small"></div>
            <div class="gear-gloss big"></div>
            <div class="gear-gloss small"></div>
        </div>
        <div class="wrench">🛠️</div>
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
    </div>

    <h1 class="heading">We'll be <span>right back</span>!</h1>
    <p class="message">{{MAINTENANCE_MESSAGE}}</p>

    <div class="bar-wrap">
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="bar-label">Work in progress</div>
    </div>

    <div class="admin-link">
        <a onclick="toggleAdminForm()">Staff / Admin sign in</a>
    </div>

    <form id="admin-form" onsubmit="adminLogin(event)" autocomplete="off">
        <div class="field"><label>Username</label><input type="text" id="mt-user" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="mt-pass" autocomplete="current-password"></div>
        <button type="submit" id="mt-btn">Sign In</button>
        <div id="mt-err"></div>
    </form>

    <footer>&copy; {{SCHOOL_NAME}} &middot; Maintenance Portal</footer>

    <script>
        // Auto-return to the app the moment maintenance is switched OFF.
        (function() {
            function backToApp() { window.location.href = '/'; }
            try {
                var es = new EventSource('/api/maintenance-events');
                es.addEventListener('maintenance', function(e) {
                    try { if (!JSON.parse(e.data || '{}').active) backToApp(); } catch (x) {}
                });
                es.onerror = function() { try { es.close(); } catch (x) {} };
            } catch (x) {}
            setInterval(function() {
                fetch('/api/maintenance-status').then(function(r) { return r.json(); }).then(function(d) {
                    if (d && !d.active) backToApp();
                }).catch(function() {});
            }, 2000);
        })();
        function toggleAdminForm() {
            var f = document.getElementById('admin-form');
            if (!f) return;
            var isShown = getComputedStyle(f).display !== 'none';
            f.style.display = isShown ? 'none' : 'block';
            if (!isShown) document.getElementById('mt-user').focus();
        }
        async function adminLogin(e) {
            if (e && e.preventDefault) e.preventDefault();
            var input = (document.getElementById('mt-user').value || '').trim();
            var password = document.getElementById('mt-pass').value;
            var err = document.getElementById('mt-err');
            var btn = document.getElementById('mt-btn');
            if (!input || !password) { err.textContent = 'Enter username and password'; return; }
            err.textContent = '';
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                var res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: input, password: password })
                });
                var data = {};
                try { data = await res.json(); } catch (x) {}
                if (!res.ok) {
                    err.textContent = (data && data.error) || 'Login failed. Please try again.';
                    if (res.status === 503) err.textContent = 'System under maintenance. Admin access only.';
                    return;
                }
                if (data && data.user && data.user.mt_bypass) {
                    document.cookie = 'mt_bypass=' + data.user.mt_bypass + '; path=/; max-age=' + (12 * 3600) + '; SameSite=Lax';
                    try { sessionStorage.setItem('currentUser', JSON.stringify(data.user)); } catch (e) {}
                    window.location.href = '/';
                    return;
                }
                err.textContent = 'You do not have maintenance access.';
            } catch (x) {
                err.textContent = 'Unable to reach the server. Please try again.';
            } finally {
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') document.getElementById('admin-form').style.display = 'none';
        });
    </script>
</body>
</html>
